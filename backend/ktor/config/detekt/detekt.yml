# Minimal detekt config — enables only the nearyou-custom ruleset. All the builtin
# Detekt rulesets are disabled (see `disableDefaultRuleSets` in the convention plugin).
# Add rules here as the project grows.

nearyou:
  active: true
  RawFromPostsRule:
    active: true
  BlockExclusionJoinRule:
    active: true
  # Guards against re-introducing a backend test-login symbol (a `/internal-dev/test-login`
  # endpoint was deliberately rejected — see mobile/app/maestro/PHASE-3-staging-test-login.md).
  # Backend has no src/dev|src/stagingDebug source sets, so ANY `*TestLogin*` decl here fires.
  TestLoginIsolationRule:
    active: true
