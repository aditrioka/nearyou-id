# Minimal detekt config — enables only the nearyou-custom ruleset. All the builtin
# Detekt rulesets are disabled (see `disableDefaultRuleSets` in the convention plugin).
#
# EVERY rule shipped by :lint:detekt-rules MUST be listed here with `active: true`.
# detekt 1.23 treats a rule that is absent from a provided config as INACTIVE
# (`Config.valueOrDefault(ACTIVE_KEY, false)`) — unlisted rules are silently skipped
# in the project run even though :lint:detekt-rules' unit tests (which use
# Config.empty, where rules default to active) stay green. That exact gap left 7 of
# 10 invariant rules dormant until the 2026-06-11 backend review.
# `DetektConfigActivationTest` in :lint:detekt-rules pins this file against the
# provider's rule list.

nearyou:
  active: true
  RawFromPostsRule:
    active: true
  BlockExclusionJoinRule:
    active: true
  # Guards against re-introducing a backend test-login symbol (a `/internal-dev/test-login`
  # endpoint was deliberately rejected — see mobile/app/maestro/PHASE-3-staging-test-login.md).
  # Backend has no src/dev|src/stagingDebug source sets, so ANY `*TestLogin*` decl here fires.
  TestLoginIsolationRule:
    active: true
  CoordinateJitterRule:
    active: true
  RateLimitTtlRule:
    active: true
  RedisHashTagRule:
    active: true
  RawXForwardedForRule:
    active: true
  OtelForbiddenAttributeRule:
    active: true
  IpAxisMustUseTryAcquireByKeyRule:
    active: true
  ContentWriteRequiresModerationRule:
    active: true
