ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        // Graceful shutdown sized to Cloud Run's 10 s SIGTERM window (docs/11 §3.3):
        // give in-flight requests 2 s to be picked up and 8 s to drain.
        shutdownGracePeriod = 2000
        shutdownTimeout = 8000
    }
    application {
        modules = [ id.nearyou.app.ApplicationKt.module ]
    }
    environment = "production"
    environment = ${?KTOR_ENV}
}

db {
    url = ${?DB_URL}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
    // docs/11 §3.2: small per-instance pools; maxInstances × poolSize ≤ Supavisor budget.
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
}

auth {
    rsaPrivateKey = ${?KTOR_RSA_PRIVATE_KEY}
    supabaseJwtSecret = ${?SUPABASE_JWT_SECRET}
    supabaseUrl = ${?SUPABASE_URL}
    google {
        audiences = ${?GOOGLE_CLIENT_IDS}
    }
    apple {
        audiences = ${?APPLE_BUNDLE_IDS}
    }
}

oidc {
    internalAudience = ${?INTERNAL_OIDC_AUDIENCE}
}
