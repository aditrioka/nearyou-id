# Shared detekt config for the JVM library modules (`:infra:*`, `:core:*`) scanned by the
# `nearyou.detekt` convention plugin. Enables ONLY the nearyou-custom invariant ruleset —
# builtin Detekt rulesets are disabled (`disableDefaultRuleSets` in the plugin), mirroring
# `backend/ktor/config/detekt/detekt.yml`.
#
# Why these modules are scanned at all: most of the SQL the invariant rules guard lives in
# `:infra:supabase` (Jdbc*Repository), the Redis key literals in `:infra:redis` callers, and
# the OTel attribute writes in `:infra:*` — yet until the 2026-06-11 backend review only
# `:backend:ktor` and `:mobile:app` ran the custom ruleset, so in-repo comments claiming
# "required by BlockExclusionJoinRule" were enforced by nothing.
#
# EVERY rule shipped by :lint:detekt-rules MUST be listed with `active: true` — detekt 1.23
# treats rules absent from a provided config as inactive. `DetektConfigActivationTest` in
# :lint:detekt-rules pins this file against the provider's rule list.

nearyou:
  active: true
  RawFromPostsRule:
    active: true
  BlockExclusionJoinRule:
    active: true
  TestLoginIsolationRule:
    active: true
  CoordinateJitterRule:
    active: true
  RateLimitTtlRule:
    active: true
  RedisHashTagRule:
    active: true
  RawXForwardedForRule:
    active: true
  OtelForbiddenAttributeRule:
    active: true
  IpAxisMustUseTryAcquireByKeyRule:
    active: true
  ContentWriteRequiresModerationRule:
    active: true
