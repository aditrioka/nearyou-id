# Ktor KMP coordinates (no -jvm suffix; Gradle metadata routes to platform artifact). Added
# in `mobile-auth-google-signin-flow` for `:mobile:app` KMP consumption — Mobile #3. The
# camelCase -jvm aliases above (`ktor-clientCore` etc.) remain in use by backend / infra
# modules and would clash with hyphen-only forms on the generated accessor — so the KMP
# aliases live under a `ktor-kmp-*` segment, producing `libs.ktor.kmp.clientCore` etc.
ktor-kmp-clientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-kmp-clientOkhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-kmp-clientDarwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-kmp-clientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-kmp-serializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-kmp-clientAuth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-kmp-clientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-kmp-clientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Android Credential Manager + Google ID helper (Mobile #3 — Google Sign-In Android substrate).
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-playServicesAuth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

# Android secure-at-rest token storage (Mobile #3 — DataStore + Tink, replacing the
# deprecated EncryptedSharedPreferences per `androidx.security:security-crypto:1.1.0-alpha07`).
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
google-tink = { module = "com.google.crypto.tink:tink-android", version.ref = "googleTink" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
