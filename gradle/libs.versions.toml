# Voyager pinned to 1.1.0-beta03 because it is the only Voyager release with explicit
# Koin 4.x support. The 1.0.1 stable line (Dec 2024) predates Koin 4.0.0 (Aug 2024) and
# the `voyager-koin` integration in 1.0.1 binds Koin 3.x APIs that conflict with the
# project's `koin = "4.1.0"` pin. Pre-stable pins are precedented in this project
# (material3 alpha, OTel alpha BOMs, semconv RC). Re-evaluate when Voyager cuts a
# stable 1.1.0 — track at the `mobile-app-scaffold-replace-wizard` archive notes.
voyager = "1.1.0-beta03"

