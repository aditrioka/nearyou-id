# Koin bumped 4.1.0 → 4.2.1 by `mobile-nav-swap-to-navigation3`: the official
# `io.insert-koin:koin-compose-navigation3` integration has no 4.1.x line (earliest release
# 4.2.0-alpha1; 4.2.1 hard-requires `koin-compose:4.2.1`), so adopting Navigation 3's Koin
# integration requires Koin 4.2.x. Verified via apply-phase library re-check (2026-06-05).
# The bump is project-wide (backend `koin-ktor`/`koin-logger-slf4j` + mobile) — a minor
# version bump over stable APIs (`install(Koin)`, `slf4jLogger()`, `module{}`, `inject()`);
# the `:backend:ktor:test` gate guards backend behavior.
koin = "4.2.1"
kotest = "5.9.1"
kotlin = "2.3.20"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.9.0"
ktlint-plugin = "12.1.2"
ktor = "3.4.1"
robolectric = "4.14.1"
lettuce = "6.5.0.RELEASE"
logback = "1.5.32"
opentelemetry-bom = "1.51.0"
opentelemetry-instrumentation-bom = "2.25.0-alpha"
password4j = "1.8.4"
samstevens-totp = "1.7.1"
slf4j = "2.0.16"
material3 = "1.10.0-alpha05"
postgresql-jdbc = "42.7.7"
# Navigation 3 — JetBrains Compose Multiplatform port of AndroidX Navigation 3
# (`org.jetbrains.androidx.navigation3`). Replaces Voyager via `mobile-nav-swap-to-navigation3`
# (the archived `mobile-app-scaffold-replace-wizard` Decision 1 pre-authorized the swap once
# state-restoration became load-bearing). Pinned to the STABLE 1.1.1 release — the apply-phase
# library re-check (2026-06-05) confirmed the CMP port has cut stable (release train
# 1.1.0-rc01 → 1.1.0 → 1.1.1), so the proposal's "pre-stable alpha" concern is moot. Full KMP
# target set incl. iosArm64 + iosSimulatorArm64. Only `navigation3-ui` is published as a CMP
# artifact (it brings `navigation3-runtime`/`-common` + `savedstate` transitively); there is no
# separate `org.jetbrains.androidx.navigation3:navigation3-runtime` to declare.
navigation3 = "1.1.1"

