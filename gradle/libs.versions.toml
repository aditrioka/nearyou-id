koin-composeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Voyager: KMP navigation framework + Koin integration. See § `voyager` pin rationale.
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-koin = { module = "cafe.adriel.voyager:voyager-koin", version.ref = "voyager" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-databasePostgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
h2 = { module = "com.h2database:h2", version.ref = "h2database" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql-jdbc" }

kotest-runnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# OpenTelemetry: SDK + API + exporter come from `opentelemetry-bom` (stable);
# per-library instrumentation (Ktor 3.0, JDBC, Lettuce 5.1) comes from
# `opentelemetry-instrumentation-bom-alpha` because the instrumentation
# packages are still under semver-zero. The two BOMs are co-versioned by the
# upstream release cadence — keep both pins in lockstep at version-bump time.
# Vendor: every consumer of these symbols MUST live inside `:infra:otel`
# (per the `observability-otel-foundation` capability spec).
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry-bom" }
opentelemetry-instrumentationBomAlpha = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha", version.ref = "opentelemetry-instrumentation-bom" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-sdkExtensionAutoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure" }
opentelemetry-exporterOtlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
opentelemetry-exporterLogging = { module = "io.opentelemetry:opentelemetry-exporter-logging" }
opentelemetry-extensionKotlin = { module = "io.opentelemetry:opentelemetry-extension-kotlin" }
opentelemetry-semconv = { module = "io.opentelemetry.semconv:opentelemetry-semconv", version = "1.30.0-rc.1" }
opentelemetry-instrumentationKtor3 = { module = "io.opentelemetry.instrumentation:opentelemetry-ktor-3.0" }
opentelemetry-instrumentationJdbc = { module = "io.opentelemetry.instrumentation:opentelemetry-jdbc" }
opentelemetry-instrumentationLettuce = { module = "io.opentelemetry.instrumentation:opentelemetry-lettuce-5.1" }

auth0-javaJwt = { module = "com.auth0:java-jwt", version.ref = "auth0-javaJwt" }
auth0-jwksRsa = { module = "com.auth0:jwks-rsa", version.ref = "auth0-jwksRsa" }

firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }

# Build-logic plugin coordinates (used by precompiled script plugins via raw module strings)
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-ktor = { module = "io.ktor.plugin:plugin", version.ref = "ktor" }
gradlePlugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-plugin" }
