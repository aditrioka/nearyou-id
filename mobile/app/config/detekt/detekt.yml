# Mobile detekt config — enables ONLY the nearyou-custom ruleset. All builtin Detekt rulesets are
# disabled via `disableDefaultRuleSets = true` in mobile/app/build.gradle.kts (mirrors backend/ktor).
# The single active rule is the test-login auth-bypass isolation guard: it fails the build if a
# `*TestLogin*` symbol is declared outside `src/dev/` or `src/stagingDebug/`. (The other rules in the
# `nearyou` ruleset target backend SQL / Redis / HTTP patterns that do not exist in mobile code, so
# they are left unlisted; only TestLoginIsolationRule is relevant here.)
nearyou:
  active: true
  TestLoginIsolationRule:
    active: true
