# Mobile detekt config — enables ONLY the nearyou-custom ruleset. All builtin Detekt rulesets are
# disabled via `disableDefaultRuleSets = true` in mobile/app/build.gradle.kts (mirrors backend/ktor).
# Two rules are active (the other rules in the `nearyou` ruleset target backend SQL / Redis / HTTP
# patterns that do not exist in mobile code, so they are left unlisted):
#  - TestLoginIsolationRule — the test-login auth-bypass isolation guard: fails the build if a
#    `*TestLogin*` symbol is declared outside `src/dev/` or `src/stagingDebug/`.
#  - MobileHardcodedStringRule — the "Mobile strings" invariant (openspec/project.md § Coding
#    Conventions): a literal `Text("…")` / `contentDescription = "…"` outside test source sets fails
#    the build; UI copy goes through `stringResource(Res.string.X)` (#184).
nearyou:
  active: true
  TestLoginIsolationRule:
    active: true
  MobileHardcodedStringRule:
    active: true
