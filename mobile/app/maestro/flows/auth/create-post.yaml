# create-post — AUTH-GATED (Phase 2 test-login required). Exercises the post composer.
# Uses HomeScreen FAB "cta_post" + PostCreationScreen testTag POST_CONTENT_FIELD_TAG = "postContentField".
appId: ${APP_ID}
tags:
  - auth-gated
---
- runFlow: ../_auth/test-login.yaml   # Phase 2: dev test-login (auth bypass)
- tapOn:
    text: "Posting"   # HomeScreen FAB = the cta_post string (verified on-device). No testTag yet; update if the string changes.
- assertVisible: "Buat postingan"                    # PostCreationScreen header — reached the composer
- tapOn: "Apa yang sedang terjadi di sekitarmu?"     # focus the composer input by its placeholder text
- inputText: "Maestro smoke: lagi di Senayan nih"
- takeScreenshot: composer-filled
# - tapOn: "Post"                  # TODO: confirm the submit-button selector against live UI
# - assertVisible: "Maestro smoke: lagi di Senayan nih"
