#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Moko Resources
# Suppress the static-framework warning printed once per build per ios* target.
# Both :shared:resources and :mobile:app declare `isStatic = true` frameworks;
# the canonical :mobile:app:copyFrameworkResourcesToApp Build Phase in
# iosApp.xcodeproj handles the resource bundle copy per Moko docs:
# https://github.com/icerockdev/moko-resources#multi-module-projects
moko.resources.disableStaticFrameworkWarning=true