<?xml version="1.0" encoding="UTF-8"?>
<!--
  Build-input source SVG for the iOS staging launcher icon (openspec change
  mobile-env-launcher-icons). NOT a shipped Res resource — it is a tooling input
  for dev/scripts/generate-ios-app-icons.sh ONLY. It is the staging analog of the
  removed logo_brand_dark.svg: the same white hexagon-cluster glyph (paths copied
  from mobile/app/src/androidMain/res/drawable-v24/ic_launcher_foreground.xml) over
  a single full-bleed background <rect> filled with the staging tint #C2410C.
  viewBox="0 0 108 108" is REQUIRED — the generator hard-fails otherwise.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#C2410C"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43.8,50.2 L54,56.1 L64.2,50.2 L64.2,38.5 L54,32.6 L43.8,38.5 L43.8,43.5"/>
    <path d="M54,56.1 L43.8,50.2 L33.7,56.1 L33.7,67.9 L43.8,73.7 L46.3,73.7"/>
    <path d="M64.2,73.7 L74.3,67.9 L74.3,56.1 L68.9,53"/>
    <path d="M64.2,73.7 L56.7,73.7"/>
  </g>
  <path d="M49.5,73.7 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0 Z" fill="#FFFFFF"/>
</svg>
