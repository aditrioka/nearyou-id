<?xml version="1.0" encoding="UTF-8"?>
<!--
  Build-input source SVG for the iOS DEV launcher icon (mobile-ios-build-config-matrix).
  NOT a shipped Res resource — tooling input for dev/scripts/generate-ios-app-icons.sh only.
  Dev analog of icon-staging.svg: same white hexagon-cluster glyph (from
  mobile/app/src/androidMain/res/drawable-v24/ic_launcher_foreground.xml) over a full-bleed
  background <rect> filled with the dev tint #15803D (forest green, matching Android dev).
  viewBox="0 0 108 108" is REQUIRED — the generator hard-fails otherwise.
-->
