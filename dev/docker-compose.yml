name: nearyou-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nearyouid-dev-postgres
    # max_connections raised from the 100 default: the backend test suite's
    # per-spec Hikari pools accumulate for the lifetime of the test JVM (the
    # known CI connection-budget pattern, PR #157), and the full DB-tagged run
    # now peaks past 100 locally — "FATAL: sorry, too many clients already"
    # mid-suite. 200 gives the gate headroom; CI's service container is
    # configured separately in the workflow.
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: nearyouid-dev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
