name: Instrumented test

# Build the :mobile:app staging-debug app + androidTest APKs and run the on-device
# instrumented tests (src/androidInstrumentedTest) on a REAL device in Firebase
# Test Lab. Unlike the Robo crawl in device-run.yml, these tests render screens
# behind the Google Sign-In wall (with fakes), so authenticated screens get real
# device evidence. The local/cloud-sandbox side is scripts/test_android.sh.
#
# Informational, like device-run: merge-gate is the only required check. Opt a
# PR out with the `skip-device-run` label (shared with device-run.yml).
on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/instrumented-test.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      device:
        description: 'Test Lab device spec (gcloud firebase test android models list)'
        default: 'model=shiba,version=34,locale=en_US,orientation=portrait'

concurrency:
  group: instrumented-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-test:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-device-run') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # post the result comment
      id-token: write        # google-github-actions/auth
    env:
      FARM: firebase
      FTL_DEVICE: ${{ github.event.inputs.device || 'model=shiba,version=34,locale=en_US,orientation=portrait' }}
      OUT_DIR: ${{ github.workspace }}/dev/device-runs/ci
      FIREBASE_PROJECT_ID: nearyou-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Same Test Lab service account as device-run.yml (see the note there on
      # why it needs roles/editor).
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TESTLAB_SA_KEY || secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: nearyou-staging

      - name: Build + run instrumented tests on a real device
        id: run
        run: bash scripts/test_android.sh

      - name: Upload instrumented-test artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-${{ github.event.pull_request.number || github.run_id }}
          path: dev/device-runs/ci/**
          if-no-files-found: warn

      # One comment per PR, edited in place on every run.
      - name: Comment result on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const outDir = process.env.OUT_DIR;
            const outcome = '${{ steps.run.outcome }}';
            const artifactUrl = '${{ steps.upload.outputs.artifact-url }}';
            const marker = '<!-- instrumented-test -->';

            let consoleUrl = '';
            try {
              const log = fs.readFileSync(path.join(outDir, 'gcloud.log'), 'utf8');
              const m = log.match(/https:\/\/console\.firebase\.google\.com\/[^\s\]]+/);
              if (m) consoleUrl = m[0];
            } catch (e) {}

            const shots = [];
            const walk = (d) => { try { for (const e of fs.readdirSync(d, {withFileTypes: true})) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.name.toLowerCase().endsWith('.png')) shots.push(e.name);
            }} catch (e) {} };
            walk(outDir);

            const verdict = outcome === 'success'
              ? '✅ All instrumented tests passed on a real device.'
              : `❌ Instrumented run ${outcome} (test failure, or quota/credentials) — see the console + artifact.`;
            const body = [
              marker,
              '### 📱 Instrumented test (Firebase Test Lab)',
              '',
              `- **Result:** ${verdict}`,
              `- **Device:** \`${process.env.FTL_DEVICE}\` · **Commit:** ${context.payload.pull_request.head.sha.slice(0, 7)}`,
              `- **Screenshots:** ${shots.length ? shots.map(s => '`' + s + '`').join(', ') : 'none'}` +
                (artifactUrl ? ` ([download artifact](${artifactUrl}))` : ''),
              consoleUrl ? `- **Test Lab results + video:** ${consoleUrl}` : '- _Console URL not found in log — check the workflow logs._',
              '',
              '<sub>Auto-posted by `.github/workflows/instrumented-test.yml`. Add the `skip-device-run` label to opt a PR out.</sub>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prior = comments.find(c => c.body && c.body.includes(marker));
            if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
